detekt {
  source.setFrom('src/main/java', 'src/test/java', 'src/androidTest/java')
}

tasks.register('detektTests', Detekt) {
  description = 'Runs detekt inspection on test sources'
  group = 'verification'
  setSource(files('src/test/java', 'src/androidTest/java'))
  config.setFrom(files("${rootDir}/config/detekt/detekt.yml"))
}

ksp {
  arg 'room.schemaLocation', "${projectDir}/schemas"
  arg 'room.incremental', 'true'
  arg 'room.expandProjection', 'true'
}

jacoco {
  toolVersion = '0.8.12'
}

tasks.withType(Test).configureEach {
  jacoco {
    includeNoLocationClasses = true
    excludes = ['jdk.internal.*']
  }
}

tasks.register('testCoverageReport', JacocoReport) {
  dependsOn 'testDebugUnitTest'
  reports {
    xml.required = true
    html.required = true
  }
  classDirectories.setFrom(files(layout.buildDirectory.dir('tmp/kotlin-classes/debug')))
  sourceDirectories.setFrom(files("${projectDir}/src/main/java"))
  executionData.setFrom(fileTree(layout.buildDirectory) {
    include 'jacoco/test-debug-UnitTest.exec'
  })
}

