configurations.all {
  resolutionStrategy.eachDependency { details ->
    def requested = details.requested
    if (requested.group == 'org.bouncycastle' &&
        ['bcpkix-jdk18on', 'bcprov-jdk18on', 'bcutil-jdk18on'].contains(requested.name)) {
      details.useVersion libs.versions.bouncycastle.get()
      details.because 'Patches Bouncy Castle vulnerabilities (CVE-2026-5588, CVE-2026-13506)'
    }
  }
}

def debugKeystorePath = file("${rootDir}/debug.keystore").absolutePath

def ensureDebugKeystore = tasks.register('ensureDebugKeystore', Exec) {
  description = 'Materialize the standard Android debug keystore if absent.'
  group = 'build setup'
  outputs.file(debugKeystorePath)
  commandLine 'sh', '-c', "test -f \"${debugKeystorePath}\" || exec keytool -genkeypair -keystore \"${debugKeystorePath}\" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'"
}

afterEvaluate {
  def validationApplicationIdSuffix = project.findProperty('validationApplicationIdSuffix') as String
  tasks.matching { it.name == 'processDebugGoogleServices' }.configureEach {
    onlyIf { validationApplicationIdSuffix == null }
  }
  tasks.matching { it.name.startsWith('validateSigning') }.configureEach {
    dependsOn ensureDebugKeystore
  }
}

def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
  taskName.endsWith('assembleRelease') || taskName.endsWith('bundleRelease') || taskName.endsWith('packageRelease')
}
def configuredReleaseKeystorePath = System.getenv('SIGNING_STORE_FILE')
def configuredReleaseKeystore = configuredReleaseKeystorePath ? file(configuredReleaseKeystorePath) : null
def releaseSigningValuesPresent = [
  System.getenv('SIGNING_STORE_PASSWORD'),
  System.getenv('SIGNING_KEY_ALIAS'),
  System.getenv('SIGNING_KEY_PASSWORD')
].every { it }
if (releaseTaskRequested && (!configuredReleaseKeystore?.exists() || !releaseSigningValuesPresent)) {
  throw new GradleException(
    'Release build requires an existing keystore and all signing variables: ' +
      'SIGNING_STORE_FILE, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD. ' +
      'Debug signing fallback is forbidden.'
  )
}
