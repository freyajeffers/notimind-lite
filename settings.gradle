pluginManagement {
  repositories {
    google {
      content {
        includeGroupByRegex 'com\\.android.*'
        includeGroupByRegex 'com\\.google.*'
        includeGroupByRegex 'androidx.*'
      }
    }
    mavenCentral()
    gradlePluginPortal()
  }
}

// plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' } // removed due to resolution issues

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
    maven {
      url = uri('https://jitpack.io')
      content {
        includeGroupByRegex 'com\\.github.*'
      }
    }
  }
}

buildCache {
  local {
    enabled = true
  }
}

gradle.beforeProject { project ->
  project.configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
      def requested = details.requested
      if (requested.group == 'org.jdom' && requested.name == 'jdom2') {
        details.useVersion '2.0.6.1'
      } else if (requested.group == 'org.apache.commons' && requested.name == 'commons-lang3') {
        details.useVersion '3.18.0'
      } else if (requested.group == 'org.apache.httpcomponents' && requested.name == 'httpclient') {
        details.useVersion '4.5.13'
      } else if (requested.group == 'com.google.guava' && requested.name == 'guava') {
        details.useVersion '32.1.3-android'
      }
    }
  }
}

rootProject.name = 'notimind lite'
include ':app'
