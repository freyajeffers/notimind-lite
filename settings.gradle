pluginManagement {
  repositories {
    google {
      content {
        includeGroupByRegex 'com\\.android.*'
        includeGroupByRegex 'com\\.google.*'
        includeGroupByRegex 'androidx.*'
      }
    }
    mavenCentral()
    gradlePluginPortal()
  }
}

// plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' } // removed due to resolution issues

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
    maven {
      url = uri('https://jitpack.io')
      content {
        includeGroupByRegex 'com\\.github.*'
      }
    }
  }
}

buildCache {
  local {
    enabled = true
  }
}

gradle.beforeProject { project ->
  project.configurations.configureEach {
    resolutionStrategy.force(
      'org.jetbrains.kotlinx:kotlinx-serialization-core:1.8.1',
      'org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.8.1',
      'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1',
      'org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.8.1'
    )
    resolutionStrategy.eachDependency { details ->
      def requested = details.requested
      if (requested.group == 'org.jdom' && requested.name == 'jdom2') {
        details.useVersion '2.0.6.1'
      } else if (requested.group == 'org.apache.commons' && requested.name == 'commons-lang3') {
        details.useVersion '3.22.0'
      } else if (requested.group == 'org.apache.httpcomponents' && requested.name == 'httpclient') {
        details.useVersion '4.5.14'
      } else if (requested.group == 'com.google.guava' && requested.name == 'guava') {
        details.useVersion '33.7.2-android'
      } else if (requested.group == 'org.bouncycastle' && requested.name in ['bcprov-jdk18on', 'bcpkix-jdk18on', 'bcutil-jdk18on']) {
        details.useVersion '1.87'
      } else if (requested.group == 'ch.qos.logback' && requested.name == 'logback-core') {
        details.useVersion '1.5.34'
      } else if (requested.group == 'org.bitbucket.b_c' && requested.name == 'jose4j') {
        details.useVersion '0.9.6'
      }
    }
  }
}

rootProject.name = 'notimind lite'
include ':app'
