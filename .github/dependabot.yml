version: 2

updates:
  # 1. Gradle dependencies, plugins, and version catalog
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    groups:
      # Group Kotlin, KSP, Room, and compiler-coupled dependencies together
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "com.google.devtools.ksp*"
          - "androidx.room*"
          - "androidx.credentials*"
      # Group AndroidX and Compose updates together (excluding compiler/KSP-coupled libs)
      androidx-compose:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.room*"
          - "androidx.credentials*"
      # Group Google and Firebase dependencies (excluding KSP)
      google-services:
        patterns:
          - "com.google.*"
        exclude-patterns:
          - "com.google.devtools.ksp*"
      # Group static analysis and tooling plugins
      lint-and-analysis:
        patterns:
          - "io.gitlab.arturbosch.detekt*"
    # Pin packages requiring compileSdk 37 until project upgrades to android-37
    ignore:
      - dependency-name: "androidx.navigation:navigation-compose"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.core:core-ktx"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.core:core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2026.0.0"]

  # 2. GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
