# CodeQL Analysis for NotiMind Lite
#
# Configured for a Kotlin/Java Android codebase.
#
# Key choices:
#   - languages: java-kotlin covers both extractors in a single job
#   - build-mode: manual — Android's Gradle build is non-trivial; we let it
#     run ./gradlew assembleDebug so the extractor sees the real classpath
#   - queries: security-extended — surface common security issues at low noise;
#     add 'security-and-quality' if you want lint-grade findings included
#   - fetch-depth: 0 — full git history so CodeQL can compute PR diff context
#   - paths-ignore — skip doc-only and markdown pushes (CI minutes saved)
#   - persist-credentials: false — prevents the GITHUB_TOKEN from leaking to
#     subsequent steps that don't need it (security best practice)
#   - concurrency.cancel-in-progress — re-runs of the same ref cancel the
#     previous run; only main/master keep running to completion
#
# To bump the CodeQL action, edit the @v3 tags. Dependabot manages these via
# `.github/dependabot.yml` (package-ecosystem: github-actions).
#
# To customize query packs, see:
#   https://github.com/github/codeql/blob/main/docs/using-codeql-code-scanning-with-your-existing-ci-system/configuring-codeql-cli.md

name: "CodeQL Analysis"

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (Kotlin / Java)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Android Debug Target
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-build-cache \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dkotlin.incremental=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
