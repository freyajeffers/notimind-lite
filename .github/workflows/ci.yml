name: Android CI

on:
  push:
    branches: [ "master", "main", "remediation/**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs='-Xmx4g -XX:+UseParallelGC'"

jobs:
  # --------------------------------------------------------------------------
  # 1. Static Analysis & Linting
  # --------------------------------------------------------------------------
  static-analysis:
    name: Lint & Detekt
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          add-job-summary-as-pr-comment: on-failure

      - name: Run Detekt & Android Lint
        run: ./gradlew detekt detektTests ktlintCheck lintDebug

      - name: Upload Lint & Detekt Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-and-detekt-reports
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-debug.html
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2. MobSF source security scan
  # --------------------------------------------------------------------------
  security-scan:
    name: MobSF Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Install MobSFScan and Semgrep
        run: python -m pip install --disable-pip-version-check mobsfscan semgrep

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Scan Android source
        run: mobsfscan app --type android --json --config .mobsf --no-fail -o mobsfscan-source.json

      - name: Scan debug APK
        run: mobsfscan app/build/outputs/apk/debug/app-debug.apk --type android --json --no-fail -o mobsfscan-debug-apk.json

      - name: Upload MobSF reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobsf-security-reports
          path: |
            mobsfscan-source.json
            mobsfscan-debug-apk.json
          retention-days: 14

  # --------------------------------------------------------------------------
  # 3. Unit Tests & Code Coverage
  # --------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          add-job-summary-as-pr-comment: on-failure

      - name: Run Unit Tests & Generate Coverage
        run: ./gradlew testDebugUnitTest testCoverageReport

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: app/build/reports/jacoco/testCoverageReport/html/
          retention-days: 14

  # --------------------------------------------------------------------------
  # 3. Release APK Build
  # --------------------------------------------------------------------------
  build-release:
    name: Assemble Release APK
    if: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Restore release signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          