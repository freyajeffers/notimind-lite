name: Android CI

on:
  push:
    branches: [ "master", "main", "remediation/**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  # Shared with android-instrumentation.yml so two Gradle runs never restore and
  # save the Robolectric artifact cache at the same time. Concurrent access made
  # Robolectric fail in MavenArtifactFetcher before any test executed.
  group: notimind-gradle-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs='-Xmx4g -XX:+UseParallelGC'"

jobs:
  # --------------------------------------------------------------------------
  # 1. Static Analysis & Linting
  # --------------------------------------------------------------------------
  static-analysis:
    name: Lint & Detekt
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          add-job-summary-as-pr-comment: on-failure

      - name: Run Detekt & Android Lint
        run: ./gradlew detekt detektTests ktlintCheck lintDebug

      - name: Upload Lint & Detekt Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-and-detekt-reports
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-debug.html
          retention-days: 7

  # --------------------------------------------------------------------------
  # 2. MobSF source security scan
  # --------------------------------------------------------------------------
  security-scan:
    name: MobSF Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Install MobSFScan and Semgrep
        run: |
          python -m pip install --disable-pip-version-check \
            mobsfscan==1.2.0 \
            semgrep==1.172.0
          command -v mobsfscan
          command -v semgrep
          semgrep --version

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify patched Guava resolution
        run: |
          ./gradlew :app:dependencyInsight \
            --dependency com.google.guava:guava \
            --configuration debugRuntimeClasspath \
            --no-daemon --console=plain | tee guava-dependency-insight.txt
          grep -F 'com.google.guava:guava:33.7.2-android (selected by rule)' guava-dependency-insight.txt

      - name: Scan Android source
        run: mobsfscan app --type android --json --config .mobsf --exit-warning -o mobsfscan-source.json

      - name: Scan debug APK
        run: mobsfscan app/build/outputs/apk/debug/app-debug.apk --type android --json --exit-warning -o mobsfscan-debug-apk.json

      - name: Upload MobSF reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobsf-security-reports
          path: |
            mobsfscan-source.json
            mobsfscan-debug-apk.json
            guava-dependency-insight.txt
          retention-days: 14

  # --------------------------------------------------------------------------
  # 3. Unit Tests & Code Coverage
  # --------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          add-job-summary-as-pr-comment: on-failure

      # Robolectric resolves its android-all runtime jar into the local Maven repository.
      # setup-gradle does not cache that directory, so every cold run re-downloads it and
      # a transient Maven failure kills each test class at load time.
      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      # Robolectric's own fetcher gives up on the first HTTP error, which fails every test
      # class at load time. curl retries far more patiently; a miss here is only a warning
      # because the unit-test step still has its own retry.
      - name: Warm Robolectric runtime jars
        continue-on-error: true
        run: |
          set -o pipefail
          base=https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented
          for version in 13-robolectric-9030017-i7 14-robolectric-10818077-i7; do
            out="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$version"
            jar="$out/android-all-instrumented-$version.jar"
            mkdir -p "$out"
            if [ -s "$jar" ]; then
              echo "already cached: $version"
              continue
            fi
            curl -fL --retry 6 --retry-delay 5 --retry-all-errors --max-time 300 \
              "$base/$version/android-all-instrumented-$version.jar" -o "$jar" \
              || echo "::warning::could not pre-fetch $version"
          done

      - name: Run Unit Tests & Generate Coverage
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew testDebugUnitTest testCoverageReport; then
              exit 0
            fi
            # Robolectric downloads its android-all runtime jar on first use. A transient
            # Maven failure kills every test class at load time, which looks identical to
            # a mass regression. Retry only that case; real failures fail immediately.
            if grep -rqs 'MavenArtifactFetcher' app/build/test-results/testDebugUnitTest; then
              echo "::warning::Robolectric runtime download failed (attempt ${attempt}); retrying"
              sleep $((attempt * 15))
              continue
            fi
            echo "Failures are not download-related; not retrying."
            exit 1
          done
          exit 1

      # Adversarial tiers run in this job, after the full suite has warmed the
      # Robolectric artifact cache. Running them in a parallel job made two
      # JVMs fetch the same android-all jar at once and fail in
      # MavenArtifactFetcher.
      - name: Adversarial gate - tier 1 (feature)
        run: ./gradlew testDebugUnitTest --tests 'com.jeffers.notimindlite.tier1feature.*' --console=plain

      - name: Adversarial gate - tier 2 (boundary)
        run: ./gradlew testDebugUnitTest --tests 'com.jeffers.notimindlite.tier2boundary.*' --console=plain

      - name: Adversarial gate - tier 3 (pairwise)
        run: ./gradlew testDebugUnitTest --tests 'com.jeffers.notimindlite.tier3pairwise.*' --console=plain

      - name: Adversarial gate - tier 4 (real world)
        run: ./gradlew testDebugUnitTest --tests 'com.jeffers.notimindlite.tier4realworld.*' --console=plain

      - name: Adversarial gate - tier 5 (security regression)
        run: |
          ./gradlew testDebugUnitTest \
            --tests 'com.jeffers.notimindlite.SecurityBehaviorTest' \
            --tests 'com.jeffers.notimindlite.DatabaseExporterTest' \
            --tests 'com.jeffers.notimindlite.tier2boundary.ExportSanitizationBoundaryTest' \
            --tests 'com.jeffers.notimindlite.tier2boundary.BackupSecurityBoundaryTest' \
            --tests 'com.jeffers.notimindlite.tier2boundary.GcmIntegrityBoundaryTest' \
            --console=plain

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: app/build/reports/jacoco/testCoverageReport/html/
          retention-days: 14

  # --------------------------------------------------------------------------
  # 6. Release APK Build
  # --------------------------------------------------------------------------
  build-release:
    name: Assemble Release APK
    if: ${{ vars.RELEASE_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Restore release signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          