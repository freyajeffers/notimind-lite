name: Android Instrumentation

# The local build host is aarch64 with no /dev/kvm, so the SDK emulator cannot
# boot there (x86_64-only emulator binaries + no nested virtualisation). GitHub's
# ubuntu runners expose /dev/kvm, so this is where instrumented tests actually run.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/java/com/jeffers/notimindlite/data/local/**'
      - 'app/schemas/**'
      - '.github/workflows/android-instrumentation.yml'

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    name: Emulator Instrumented Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -camera-back none -camera-front none
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
