name: Android Instrumentation

# The local build host is aarch64 with no /dev/kvm, so the SDK emulator cannot
# boot there (x86_64-only emulator binaries + no nested virtualisation). GitHub's
# ubuntu runners expose /dev/kvm, so this is where instrumented tests actually run.
#
# The emulator is driven with SDK tools rather than a third-party action because
# this repository restricts Actions to github-owned and verified creators.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/java/com/jeffers/notimindlite/data/local/**'
      - 'app/schemas/**'
      - '.github/workflows/android-instrumentation.yml'

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: '34'
  AVD_NAME: ci-api34

jobs:
  instrumented-tests:
    name: Emulator Instrumented Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Install emulator and system image
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "sdk=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-${API_LEVEL};google_apis;x86_64"

      - name: Create AVD
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "no" | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd \
            --name "$AVD_NAME" \
            --package "system-images;android-${API_LEVEL};google_apis;x86_64" \
            --device "pixel_6" \
            --force

      - name: Boot emulator
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          "$SDK/emulator/emulator" -avd "$AVD_NAME" \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -camera-back none -camera-front none \
            -accel on > /tmp/emulator.log 2>&1 &
          "$SDK/platform-tools/adb" wait-for-device
          timeout 900 bash -c 'until [ "$("$0" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done' \
            "$SDK/platform-tools/adb"
          "$SDK/platform-tools/adb" shell input keyevent 82 || true
          "$SDK/platform-tools/adb" devices -l

      - name: Run instrumented tests
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK" \
            ./gradlew connectedDebugAndroidTest --console=plain

      - name: Emulator log on failure
        if: failure()
        run: tail -n 200 /tmp/emulator.log || true

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
