name: Android Instrumentation

# The local build host is aarch64 with no /dev/kvm, so the SDK emulator cannot
# boot there (x86_64-only emulator binaries + no nested virtualisation). GitHub's
# ubuntu runners expose /dev/kvm, so this is where instrumented tests actually run.
#
# The emulator is driven with SDK tools rather than a third-party action because
# this repository restricts Actions to github-owned and verified creators.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/java/com/jeffers/notimindlite/data/local/**'
      - 'app/schemas/**'
      - '.github/workflows/android-instrumentation.yml'

permissions:
  contents: read

concurrency:
  # Shared with ci.yml; see the note there. Serialising keeps the shared Gradle
  # and Robolectric artifact cache from being written by two jobs at once.
  group: notimind-gradle-${{ github.ref }}
  cancel-in-progress: false

env:
  API_LEVEL: '34'
  AVD_NAME: ci-api34

jobs:
  instrumented-tests:
    name: Emulator Instrumented Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not readable/writable; emulator cannot accelerate'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Install emulator and system image
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "sdk=$SDK"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          packages=(
            platform-tools
            emulator
            "platforms;android-37.2"
            "build-tools;37.0.0"
            "system-images;android-${API_LEVEL};google_apis;x86_64"
          )
          installed=0
          for attempt in 1 2 3; do
            echo "Installing Android SDK packages (attempt ${attempt}/3)"
            if "$SDKMANAGER" --install "${packages[@]}"; then
              installed=1
              break
            fi
            echo "::warning::SDK package installation failed; removing partial downloads before retry"
            rm -rf "$SDK/.temp"/*
            rm -rf "$SDK/system-images/android-${API_LEVEL}/google_apis/x86_64"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          if [ "$installed" -ne 1 ]; then
            echo '::error::Android SDK package installation failed after 3 attempts'
            exit 1
          fi

      - name: Create AVD
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd \
            --name "$AVD_NAME" \
            --package "system-images;android-${API_LEVEL};google_apis;x86_64" \
            --device "pixel_6" \
            --force
          echo "--- AVD home ---"
          ls -la "$ANDROID_AVD_HOME"
          echo "--- emulator -list-avds ---"
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" "$SDK/emulator/emulator" -list-avds

      - name: Boot emulator
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          ADB="$SDK/platform-tools/adb"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          "$SDK/emulator/emulator" -avd "$AVD_NAME" \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -camera-back none -camera-front none \
            -accel on -no-metrics > /tmp/emulator.log 2>&1 &
          emulator_pid=$!

          echo "waiting for emulator to register with adb"
          registered=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo '::error::Emulator process exited during startup'
              tail -n 120 /tmp/emulator.log
              exit 1
            fi
            if "$ADB" devices | grep -qE '^emulator-[0-9]+[[:space:]]+device'; then
              registered=1
              break
            fi
            sleep 5
          done
          if [ "$registered" -ne 1 ]; then
            echo '::error::Emulator never registered with adb within 300s'
            tail -n 120 /tmp/emulator.log
            exit 1
          fi

          echo "waiting for boot_completed"
          booted=0
          for _ in $(seq 1 180); do
            state=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$state" = "1" ]; then
              booted=1
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo '::error::Emulator process exited during boot'
              tail -n 120 /tmp/emulator.log
              exit 1
            fi
            sleep 5
          done
          if [ "$booted" -ne 1 ]; then
            echo '::error::Emulator did not finish booting within 900s'
            tail -n 120 /tmp/emulator.log
            exit 1
          fi

          "$ADB" shell input keyevent 82 || true
          "$ADB" devices -l

      - name: Run instrumented tests
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK" \
            ./gradlew connectedDebugAndroidTest --console=plain

      - name: Emulator log on failure
        if: failure()
        run: tail -n 200 /tmp/emulator.log || true

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
